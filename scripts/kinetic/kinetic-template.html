<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>kinetic</title>
    <style>
      :root {
        --kn-ink: #ff2020;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #deck {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      .page {
        position: absolute;
        inset: 0;
        display: none;
        background: #000;
      }
      .page.current {
        display: block;
      }
      .page > svg,
      #overlay,
      #marks {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #overlay,
      #marks {
        pointer-events: none;
        z-index: 10;
      }
      #marks {
        overflow: visible;
      }
      #marks g,
      #marks path {
        fill: none;
        stroke: var(--kn-ink);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #marks > path {
        stroke-opacity: 0.45;
      }
      #marks circle {
        fill: var(--kn-ink);
      }
      body[data-mode="laser"],
      body[data-mode="laser"] * {
        cursor: none;
      }
      body[data-mode="pen"],
      body[data-mode="pen"] * {
        cursor: crosshair;
        touch-action: none;
      }
      body[data-fullscreen="false"] .kn-fullscreen,
      body[data-native="false"] .kn-native {
        display: none;
      }
      #help {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        font: 16px/1.6 sans-serif;
        color: #fff;
      }
      #help.open {
        display: flex;
      }
      #help table {
        background: rgba(20, 20, 20, 0.92);
        border-radius: 8px;
        padding: 16px 24px;
        border-spacing: 16px 4px;
      }
      #help kbd {
        font: 14px monospace;
        padding: 1px 6px;
        border: 1px solid #fff8;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="deck">
      <!--PAGES-->
      <svg id="overlay"></svg>
      <svg id="marks"></svg>
    </div>
    <div id="help">
      <table>
        <tr>
          <td><kbd>&rarr;</kbd> <kbd>Space</kbd> <kbd>Page Down</kbd> click</td>
          <td>next page</td>
        </tr>
        <tr>
          <td><kbd>&larr;</kbd> <kbd>Page Up</kbd></td>
          <td>previous page</td>
        </tr>
        <tr class="kn-fullscreen">
          <td><kbd>f</kbd></td>
          <td>full screen on and off</td>
        </tr>
        <tr>
          <td><kbd>?</kbd></td>
          <td>this help on and off</td>
        </tr>
        <tr>
          <td><kbd>l</kbd></td>
          <td>laser pointer on and off</td>
        </tr>
        <tr>
          <td><kbd>p</kbd></td>
          <td>pen on and off</td>
        </tr>
        <tr>
          <td><kbd>c</kbd></td>
          <td>clear the pen marks</td>
        </tr>
        <tr>
          <td><kbd>Esc</kbd></td>
          <td>close this help, or stop the pen or laser</td>
        </tr>
        <tr class="kn-native">
          <td><kbd>Cmd</kbd>+<kbd>Q</kbd> <kbd>Cmd</kbd>+<kbd>W</kbd></td>
          <td>close the window</td>
        </tr>
      </table>
    </div>
    <script>
      window.KN_IMAGES = /*IMAGES*/;
    </script>
    <script>
      /*VIEWER*/
    </script>
  </body>
</html>
